# ! This Apache2 file is NOT AUTOMATICALLY GENERATED or PUSHED IN PRODUCTION AUTOMATICALLY  
# ! It is just a reference that NEEDS TO FIT THE EXACT SERVER CONFIGURATION to ensure reproductibility

<VirtualHost *:80>
    ServerName onmangeou.dev-it.app
    Redirect permanent / https://onmangeou.dev-it.app/
</VirtualHost>

<VirtualHost *:443>
    ServerName onmangeou.dev-it.app

    ProtocolsHonorOrder On
    Protocols h2 h2c http/1.1

    ProxyPreserveHost On
    
    ProxyPass / http://127.0.0.1:4567/
    ProxyPassReverse / http://127.0.0.1:4567/

    # SSL configuration
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/onmangeou.dev-it.app/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/onmangeou.dev-it.app/privkey.pem

    # Log files
    ErrorLog ${APACHE_LOG_DIR}/toulatino-prod_error.log
    CustomLog ${APACHE_LOG_DIR}/toulatino-prod_access.log combined
</VirtualHost>
