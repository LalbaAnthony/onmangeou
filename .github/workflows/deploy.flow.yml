name: Deploy Lunch Voting App to Production

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/*"
      - "src/**"
      - "public/**"
      - "package.json"
      - "tsconfig.json"

  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if no changes detected'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '22'
  APP_NAME: 'onmangeou'
  PM2_PROCESS_NAME: 'onmangeou'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run type-check

      - name: Lint Code
        run: npm run lint

      - name: Build TypeScript
        run: npm run build

      - name: Cache Build Artifacts
        uses: actions/cache@v3
        with:
          path: |
            dist/
            node_modules/
          key: ${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: production
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore Build Cache
        uses: actions/cache@v3
        with:
          path: |
            dist/
            node_modules/
          key: ${{ runner.os }}-build-${{ github.sha }}

      - name: Rebuild if cache miss
        run: |
          if [ ! -d "dist" ]; then
            npm ci
            npm run build
          fi

      - name: Create Production Package
        run: |
          mkdir -p production-build
          cp -r dist/ production-build/
          cp -r public/ production-build/
          cp package.json production-build/
          cp package-lock.json production-build/
          
          # Créer un script de déploiement
          cat > production-build/deploy.sh << 'EOF'
          #!/bin/bash
          set -e
          
          echo "🚀 Démarrage du déploiement..."
          
          # Backup de la version précédente
          if [ -d "current" ]; then
            mv current backup-$(date +%Y%m%d-%H%M%S) || true
          fi
          
          # Installation des dépendances production uniquement
          echo "📦 Installation des dépendances..."
          npm ci --only=production --silent
          
          # Vérification de la santé de l'application
          echo "🔍 Vérification de l'intégrité..."
          if [ ! -f "dist/server.js" ]; then
            echo "❌ Erreur: server.js non trouvé"
            exit 1
          fi
          
          # Création du dossier de données si nécessaire
          mkdir -p data
          chmod 755 data
          
          echo "✅ Déploiement préparé avec succès"
          EOF
          
          chmod +x production-build/deploy.sh

      - name: Transfer Files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT || '22' }}
          source: "production-build/*"
          target: "/var/www/html/${{ secrets.PROD_FOLDER }}/new-release"
          strip_components: 1
          timeout: 300s

      - name: Deploy Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT || '22' }}
          timeout: 300s
          script: |
            set -e
            
            cd /var/www/html/${{ secrets.PROD_FOLDER }}
            
            # Exécuter le script de déploiement
            if [ -d "new-release" ]; then
              cd new-release
              ./deploy.sh
              
              # Basculer vers la nouvelle version
              cd ..
              mv new-release current
              
              echo "📁 Structure du projet:"
              ls -la current/
            else
              echo "❌ Erreur: Dossier new-release non trouvé"
              exit 1
            fi

      - name: Manage PM2 Process
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT || '22' }}
          timeout: 60s
          script: |
            set -e
            
            cd /var/www/html/${{ secrets.PROD_FOLDER }}/current
            
            # Configuration PM2
            cat > ecosystem.config.js << EOF
            module.exports = {
              apps: [{
                name: '${{ env.PM2_PROCESS_NAME }}',
                script: 'dist/server.js',
                cwd: '/var/www/html/${{ secrets.PROD_FOLDER }}/current',
                instances: 1,
                exec_mode: 'fork',
                env: {
                  NODE_ENV: 'production',
                  PORT: 4567
                },
                error_file: './logs/err.log',
                out_file: './logs/out.log',
                log_file: './logs/combined.log',
                time: true,
                max_memory_restart: '500M',
                node_args: '--max-old-space-size=512'
              }]
            };
            EOF
            
            # Créer le dossier logs
            mkdir -p logs
            
            # Démarrer ou redémarrer PM2
            if pm2 describe ${{ env.PM2_PROCESS_NAME }} > /dev/null 2>&1; then
              echo "🔄 Redémarrage de l'application..."
              pm2 restart ecosystem.config.js
            else
              echo "🚀 Démarrage de l'application..."
              pm2 start ecosystem.config.js
            fi
            
            # Sauvegarder la configuration PM2
            pm2 save
            
            # Vérifier le statut
            sleep 3
            pm2 status ${{ env.PM2_PROCESS_NAME }}
            
            # Test de santé de l'application
            echo "🏥 Test de santé de l'application..."
            for i in {1..10}; do
              if curl -f http://localhost:3000/api/restaurants > /dev/null 2>&1; then
                echo "✅ Application en ligne et fonctionnelle"
                break
              else
                echo "⏳ Tentative $i/10 - En attente de l'application..."
                sleep 2
              fi
              
              if [ $i -eq 10 ]; then
                echo "❌ Échec du test de santé"
                pm2 logs ${{ env.PM2_PROCESS_NAME }} --lines 20
                exit 1
              fi
            done

      - name: Restart Apache and Cleanup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT || '22' }}
          timeout: 60s
          script: |
            set -e
            
            # Test de la configuration Apache
            if sudo apache2ctl configtest; then
              echo "✅ Configuration Apache valide"
              sudo systemctl reload apache2