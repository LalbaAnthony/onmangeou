name: CI & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 3 10 * *" # Monthly redeploy on the 10th day of each month at 3:00 AM, to ensure that all dependencies are up to date and security patches are applied
  workflow_dispatch:

env:
  IMAGE: docker.io/lalbaanthony/onmangeou

jobs:
  docker:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container registry
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.prod
          # Pull requests only validate that the image builds; they must not
          # publish a tag to the registry the production server pulls from.
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Deploy to Prod
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Create deployment directory
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p /home/${{ secrets.SSH_USER }}/${{ secrets.FOLDER }}"

      - name: Generate .env file
        run: |
          cat <<EOF > .env
          NODE_ENV=production
          PORT=${{ secrets.PORT }}
          TZ=${{ vars.TZ || 'Europe/Paris' }}
          EOF

      - name: Copy deployment files
        run: |
          scp -o StrictHostKeyChecking=accept-new \
              -P ${{ secrets.SSH_PORT }} \
              docker-compose.yml .env \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/${{ secrets.FOLDER }}/

      - name: Remote deploy
        id: remote-deploy
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd /home/${{ secrets.SSH_USER }}/${{ secrets.FOLDER }} &&
              export COMPOSE_PROJECT_NAME=${{ secrets.FOLDER }} &&
              export IMAGE=${{ env.IMAGE }}:main &&
              (docker compose --profile production down || true) &&
              sleep 2 &&
              docker compose --profile production pull &&
              docker compose --profile production up -d --remove-orphans &&
              docker container prune -f --filter \"label=com.docker.compose.project=\$COMPOSE_PROJECT_NAME\" &&
              docker image prune -f"

      - name: Verify deployment
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "for i in \$(seq 1 15); do
               if curl -fsS http://127.0.0.1:${{ secrets.PORT }}/health > /dev/null; then
                 echo 'Health check OK'; exit 0
               fi
               sleep 2
             done
             echo 'Health check failed'
             docker logs --tail 50 onmangeou-prod || true
             exit 1"
